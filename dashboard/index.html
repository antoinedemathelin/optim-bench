<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>optim-bench dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --surface-2: #f1f1ef; --grid: #e4e4e0; --border: #d9d9d4;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7d7c77;
    --lib: #2a78d6; --holdout: #eb6834; --base: #1baf7a; --bad: #e34948; --good: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --surface-2: #232322; --grid: #2f2f2d; --border: #3a3a37;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
      --lib: #3987e5; --holdout: #d95926; --base: #199e70; --bad: #e66767; --good: #3aa03a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #232322; --grid: #2f2f2d; --border: #3a3a37;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
    --lib: #3987e5; --holdout: #d95926; --base: #199e70; --bad: #e66767; --good: #3aa03a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text-primary);
         font: 15px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 32px 0 8px; }
  .sub { color: var(--text-secondary); margin: 0 0 20px; }
  .hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin: 16px 0 8px; }
  .hero .num { font-size: 52px; font-weight: 600; line-height: 1; }
  .hero .lbl { color: var(--text-secondary); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
  .tile .lbl { color: var(--text-secondary); font-size: 13px; }
  .tile .val { font-size: 24px; font-weight: 600; }
  .tile .delta { font-size: 13px; color: var(--text-secondary); }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 8px; margin-top: 12px; background: var(--surface); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle;
                         margin-right: 6px; background: var(--c); border-radius: 1px; }
  .legend .rect::before { height: 10px; border-radius: 2px; }
  .legend .dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 3px, transparent 3px 6px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axis text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .hit { fill: transparent; }
  .xhair { stroke: var(--text-muted); stroke-width: 1; opacity: 0; }
  .bar { rx: 0; }
  .endlabel { fill: var(--text-secondary); font-size: 12px; }
  .tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
         display: none; z-index: 5; min-width: 150px; }
  .tip .t { color: var(--text-secondary); margin-bottom: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .tip .row b { font-variant-numeric: tabular-nums; }
  .tip .row i { display: inline-block; width: 12px; height: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th { color: var(--text-secondary); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .wrong { color: var(--bad); font-weight: 600; }
  a { color: inherit; }
  .empty { color: var(--text-secondary); padding: 24px 0; }
  @media (max-width: 600px) { .hero .num { font-size: 40px; } }
</style>
</head>
<body>
<main>
  <h1>optim-bench</h1>
  <p class="sub" id="sub">Solver evaluations against the hidden suite, compared with HiGHS on the same hardware.</p>
  <div id="app"><p class="empty">Loading history/index.json …</p></div>
</main>
<div class="tip" id="tip"></div>
<script>
(async function () {
  const app = document.getElementById("app");
  const tip = document.getElementById("tip");
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let data;
  try {
    data = await (await fetch("../history/index.json", {cache: "no-store"})).json();
  } catch (e) {
    app.innerHTML = ""; const p = document.createElement("p"); p.className = "empty";
    p.textContent = "No history yet: history/index.json is missing. Run sandbox/build_index.py after an evaluation."; app.appendChild(p); return;
  }
  const base = data.baseline, evals = (data.evaluations || []).filter(e => e.status === "ok" && e.feedback);
  const failed = (data.evaluations || []).filter(e => e.status !== "ok");
  app.innerHTML = "";
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt = (v, d = 1) => v == null ? "–" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});

  if (!evals.length) {
    app.appendChild(el("p", "empty", base ? "Baseline recorded; no solver tag evaluated yet." : "No evaluations yet."));
  } else {
    const last = evals[evals.length - 1], fb = last.feedback, ho = last.holdout;
    const bfb = base && base.feedback, bho = base && base.holdout;
    // hero + tiles
    const hero = el("div", "hero");
    const n = el("div", "num", fmt(fb.sgm10) + " s"); hero.appendChild(n);
    const l = el("div", "lbl"); l.textContent = `SGM-10 on the feedback set, ${last.ref}` + (bfb ? ` · HiGHS ${fmt(bfb.sgm10)} s` : ""); hero.appendChild(l);
    app.appendChild(hero);
    const tiles = el("div", "tiles");
    const tile = (lbl, val, delta, good) => { const t = el("div", "tile"); t.appendChild(el("div", "lbl", lbl)); t.appendChild(el("div", "val", val));
      if (delta) t.appendChild(el("div", "delta " + (good == null ? "" : good ? "good" : "bad"), delta)); tiles.appendChild(t); };
    tile("Solved (feedback)", `${fb.solved} / ${fb.n}`, bfb ? `HiGHS ${bfb.solved} / ${bfb.n}` : "", bfb ? (fb.solved >= bfb.solved) : null);
    tile("Wrong answers", String(fb.wrong + (ho ? ho.wrong : 0)), fb.wrong + (ho ? ho.wrong : 0) ? (fb.wrong_kinds || []).concat(ho ? ho.wrong_kinds : []).join(", ") : "none", !(fb.wrong + (ho ? ho.wrong : 0)));
    if (ho) tile("SGM-10 (held-out)", fmt(ho.sgm10) + " s", bho ? `HiGHS ${fmt(bho.sgm10)} s` : "", bho ? ho.sgm10 <= bho.sgm10 : null);
    tile("Evaluations", String(evals.length), last.date.slice(0, 10) + " · " + (last.solver ? `${last.solver.name || ""} ${last.solver.version || ""}`.trim() : ""));
    app.appendChild(tiles);

    // line charts over evaluations
    const series = (key, field) => evals.map(e => e[key] ? e[key][field] : null);
    lineChart("SGM-10 over evaluations (seconds, lower is better)", evals.map(e => e.ref),
      [{name: "feedback set", color: css("--lib"), values: series("feedback", "sgm10")},
       {name: "held-out set", color: css("--holdout"), values: series("holdout", "sgm10")}],
      base ? [{name: "HiGHS, feedback", color: css("--base"), value: bfb.sgm10}] : [], " s");
    lineChart("Instances solved over evaluations", evals.map(e => e.ref),
      [{name: "feedback set", color: css("--lib"), values: series("feedback", "solved")},
       {name: "held-out set", color: css("--holdout"), values: series("holdout", "solved")}],
      base ? [{name: "HiGHS, feedback", color: css("--base"), value: bfb.solved}] : [], "", 0);

    // per-area bars, latest vs baseline
    const areas = Object.keys(fb.by_area);
    barChart(`SGM-10 by application area, ${last.ref} vs HiGHS (feedback set, seconds)`, areas,
      [{name: last.ref, color: css("--lib"), values: areas.map(a => fb.by_area[a].sgm10)},
       {name: "HiGHS", color: css("--base"), values: areas.map(a => bfb && bfb.by_area[a] ? bfb.by_area[a].sgm10 : null)}]);
    const fams = Object.keys(fb.by_family);
    barChart(`SGM-10 by family, ${last.ref} vs HiGHS (feedback set, seconds)`, fams,
      [{name: last.ref, color: css("--lib"), values: fams.map(a => fb.by_family[a].sgm10)},
       {name: "HiGHS", color: css("--base"), values: fams.map(a => bfb && bfb.by_family[a] ? bfb.by_family[a].sgm10 : null)}]);
  }

  // table of all evaluations (the table view)
  app.appendChild(el("h2", null, "All evaluations"));
  const tbl = el("table"); const thead = el("thead"); const tr = el("tr");
  for (const [h, num] of [["tag", 0], ["date", 0], ["solver", 0], ["solved (fb)", 1], ["SGM-10 fb", 1], ["solved (ho)", 1], ["SGM-10 ho", 1], ["wrong", 1], ["wall min", 1], ["report", 0]]) {
    tr.appendChild(el("th", num ? "num" : "", h)); }
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el("tbody");
  const rowFor = (e, label) => {
    const r = el("tr"); const f = e.feedback, h = e.holdout;
    r.appendChild(el("td", null, label || e.ref)); r.appendChild(el("td", null, e.date.slice(0, 16).replace("T", " ")));
    r.appendChild(el("td", null, e.solver ? `${e.solver.name || ""} ${e.solver.version || ""}`.trim() : (e.status !== "ok" ? "failed: " + (e.error || "") : "")));
    r.appendChild(el("td", "num", f ? `${f.solved}/${f.n}` : "–")); r.appendChild(el("td", "num", f ? fmt(f.sgm10) : "–"));
    r.appendChild(el("td", "num", h ? `${h.solved}/${h.n}` : "–")); r.appendChild(el("td", "num", h ? fmt(h.sgm10) : "–"));
    const w = (f ? f.wrong : 0) + (h ? h.wrong : 0); r.appendChild(el("td", "num" + (w ? " wrong" : ""), String(w)));
    r.appendChild(el("td", "num", fmt(e.wall_minutes, 0)));
    const td = el("td"); const a = el("a", null, "report"); a.href = "../history/" + e.report; td.appendChild(a); r.appendChild(td);
    return r;
  };
  if (base) tb.appendChild(rowFor(base, "HiGHS baseline"));
  for (const e of [...evals].reverse()) tb.appendChild(rowFor(e));
  for (const e of failed) tb.appendChild(rowFor(e));
  tbl.appendChild(tb); app.appendChild(tbl);
  if (base) document.getElementById("sub").textContent = `Hardware: ${base.hardware || "?"}. Limit ${base.time_limit} s per instance.`;

  // ---- charts -------------------------------------------------------------
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (t, attrs) => { const n = document.createElementNS(NS, t); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  function frame(title, legendItems) {
    const card = el("div", "card"); card.appendChild(el("h2", null, title)).style.margin = "0 0 6px";
    const lg = el("div", "legend");
    for (const it of legendItems) { const s = el("span", it.kind || "", it.name); s.style.setProperty("--c", it.color); lg.appendChild(s); }
    card.appendChild(lg); app.appendChild(card); return card;
  }
  function ticks(max, n = 4) { const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), s = [1, 2, 2.5, 5, 10].find(m => m * p >= raw) * p; const out = []; for (let v = 0; v <= max + 1e-9; v += s) out.push(+v.toFixed(6)); return out; }
  function showTip(x, y, title, rows) {
    tip.innerHTML = ""; tip.appendChild(el("div", "t", title));
    for (const r of rows) { const d = el("div", "row"); const left = el("span"); const i = el("i"); i.style.setProperty("--c", r.color); left.appendChild(i); left.appendChild(document.createTextNode(r.name)); d.appendChild(left); d.appendChild(el("b", null, r.value)); tip.appendChild(d); }
    tip.style.display = "block"; const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, window.innerWidth - w - 8) + "px"; tip.style.top = Math.max(8, y - h - 12) + "px";
  }
  const hideTip = () => tip.style.display = "none";

  function lineChart(title, labels, series, refs, unit, digits = 1) {
    const card = frame(title, series.map(s => ({name: s.name, color: s.color})).concat(refs.map(r => ({name: r.name, color: r.color, kind: "dash"}))));
    const W = 1000, H = 300, m = {l: 50, r: 110, t: 12, b: 34}; const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = series.flatMap(s => s.values).concat(refs.map(r => r.value)).filter(v => v != null);
    const max = Math.max(1, ...all) * 1.08, tk = ticks(max); const ymax = tk[tk.length - 1] < max ? tk[tk.length - 1] + (tk[1] - tk[0]) : tk[tk.length - 1];
    const xs = i => m.l + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)), ys = v => m.t + ih - v / ymax * ih;
    const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`, role: "img"}); card.appendChild(svg);
    const grid = svgEl("g", {class: "grid"}), ax = svgEl("g", {class: "axis"}); svg.appendChild(grid); svg.appendChild(ax);
    for (const v of ticks(ymax)) { grid.appendChild(svgEl("line", {x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v)}));
      const t = svgEl("text", {x: m.l - 8, y: ys(v) + 4, "text-anchor": "end"}); t.textContent = fmt(v, digits); ax.appendChild(t); }
    const step = Math.max(1, Math.ceil(labels.length / 8));
    labels.forEach((lb, i) => { if (i % step === 0 || i === labels.length - 1) { const t = svgEl("text", {x: xs(i), y: H - 12, "text-anchor": "middle"}); t.textContent = lb; ax.appendChild(t); } });
    for (const r of refs) { svg.appendChild(svgEl("line", {x1: m.l, x2: W - m.r, y1: ys(r.value), y2: ys(r.value), stroke: r.color, "stroke-width": 2, "stroke-dasharray": "4 4"}));
      const t = svgEl("text", {x: W - m.r + 8, y: ys(r.value) + 4, class: "endlabel"}); t.textContent = `${r.name} ${fmt(r.value, digits)}${unit}`; svg.appendChild(t); }
    for (const s of series) {
      const pts = s.values.map((v, i) => v == null ? null : [xs(i), ys(v)]).filter(Boolean);
      if (!pts.length) continue;
      svg.appendChild(svgEl("path", {class: "line", stroke: s.color, d: pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ")}));
      for (const p of pts) svg.appendChild(svgEl("circle", {class: "dot", cx: p[0], cy: p[1], r: 4, fill: s.color}));
      const lastV = s.values.filter(v => v != null).pop(), lp = pts[pts.length - 1];
      const t = svgEl("text", {x: lp[0] + 8, y: lp[1] + 4, class: "endlabel"}); t.textContent = `${fmt(lastV, digits)}${unit}`; svg.appendChild(t);
    }
    const xh = svgEl("line", {class: "xhair", y1: m.t, y2: m.t + ih}); svg.appendChild(xh);
    const hit = svgEl("rect", {class: "hit", x: m.l, y: m.t, width: iw, height: ih}); svg.appendChild(hit);
    const onMove = ev => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
      let i = 0, best = 1e9; labels.forEach((_, k) => { const d = Math.abs(xs(k) - px); if (d < best) { best = d; i = k; } });
      xh.setAttribute("x1", xs(i)); xh.setAttribute("x2", xs(i)); xh.style.opacity = 1;
      showTip(ev.clientX, ev.clientY, labels[i], series.map(s => ({name: s.name, color: s.color, value: s.values[i] == null ? "–" : fmt(s.values[i], digits) + unit}))
        .concat(refs.map(r => ({name: r.name, color: r.color, value: fmt(r.value, digits) + unit})))); };
    hit.addEventListener("pointermove", onMove); hit.addEventListener("pointerleave", () => { xh.style.opacity = 0; hideTip(); });
  }

  function barChart(title, cats, series) {
    const card = frame(title, series.map(s => ({name: s.name, color: s.color, kind: "rect"})));
    const rowH = 30, W = 1000, m = {l: 170, r: 70, t: 8, b: 26}, H = m.t + m.b + cats.length * rowH, iw = W - m.l - m.r;
    const all = series.flatMap(s => s.values).filter(v => v != null); const max = Math.max(1, ...all) * 1.05;
    const tk = ticks(max); const xmax = tk[tk.length - 1] < max ? tk[tk.length - 1] + (tk[1] - tk[0]) : tk[tk.length - 1];
    const xs = v => m.l + v / xmax * iw;
    const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`, role: "img"}); card.appendChild(svg);
    const grid = svgEl("g", {class: "grid"}), ax = svgEl("g", {class: "axis"}); svg.appendChild(grid); svg.appendChild(ax);
    for (const v of ticks(xmax)) { grid.appendChild(svgEl("line", {x1: xs(v), x2: xs(v), y1: m.t, y2: H - m.b}));
      const t = svgEl("text", {x: xs(v), y: H - 8, "text-anchor": "middle"}); t.textContent = fmt(v, 0); ax.appendChild(t); }
    const bh = Math.min(10, (rowH - 8) / series.length - 2);
    cats.forEach((c, i) => {
      const y0 = m.t + i * rowH + 4; const t = svgEl("text", {x: m.l - 8, y: m.t + i * rowH + rowH / 2 + 4, "text-anchor": "end"}); t.textContent = c; ax.appendChild(t);
      series.forEach((s, k) => { const v = s.values[i]; if (v == null) return; const y = y0 + k * (bh + 2); const w = Math.max(2, xs(v) - m.l);
        const path = svgEl("path", {fill: s.color, d: `M${m.l} ${y} h${w - 4} a4 4 0 0 1 4 4 v${bh - 8} a4 4 0 0 1 -4 4 h${-(w - 4)} z`}); svg.appendChild(path);
        const hit = svgEl("rect", {class: "hit", x: m.l, y: y - 1, width: iw, height: bh + 2}); svg.appendChild(hit);
        hit.addEventListener("pointermove", ev => { path.style.opacity = .75; showTip(ev.clientX, ev.clientY, c, series.map(q => ({name: q.name, color: q.color, value: q.values[i] == null ? "–" : fmt(q.values[i]) + " s"}))); });
        hit.addEventListener("pointerleave", () => { path.style.opacity = 1; hideTip(); }); });
    });
  }
})();
</script>
</body>
</html>
